[package]
name = "lakehouse_rag"
version = "0.1.0"
edition = "2024"

[dependencies]
# Runtime Asíncrono
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialización y Validación
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

# Modelado de Errores y Utilidades
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1.12", features = ["v4", "serde"] }

# Logging y Observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Grafo
petgraph = { version = "0.7", features = ["serde-1"] }

# Lakehouse, Motor Analítico y Vectorial
arrow = { version = "53", features = ["prettyprint", "json"] }
arrow-array = "53"
arrow-schema = { version = "53", features = ["serde"] }
datafusion = "44"
lancedb = "0.15"
fastembed = "4"

# Interfaz TUI y GUI Nativa de Escritorio
ratatui = "0.29"
crossterm = "0.28"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"


[profile.dev]
debug = 1

[profile.test]
debug = 1
